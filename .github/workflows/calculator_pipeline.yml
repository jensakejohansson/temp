# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs the docker login command using the runners shell
      - name: login to azure
        uses: docker/login-action@v3
        with:
          registry: judevops.azurecr.io
          username: ${{secrets.AZURE_USERNAME}}
          password: ${{secrets.AZURE_PASSWORD}}

      # Installs all dependencies -> starts API
      - name: start API
        run: |
          pip install pytest assertpy requests openapi-python-client playwright
          playwright install

      - name: run docker compose for front- & backend
        run: docker compose -p webcalculator up -d

      - name: Wait for setup to finish
        run: sleep 15

      - name: execute tests
        run: |
          export PYTHONPATH=.
          pytest test --junit-xml=report.xml

      # Publishes the created report in root directory
      - name: publish test report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'report.xml'

      # create & push new docker image based on repository files
      - name: new docker image (based on repository files)
        run: |
          docker build -t judevops.azurecr.io/stanislava_vykhodets-calculator ./BE
          docker push judevops.azurecr.io/stanislava_vykhodets-calculator
