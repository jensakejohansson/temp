name: Calculator CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  test-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r BE/requirements.txt
          pip install pytest requests

      - name: Start Calculator REST API
        run: |
          nohup python BE/calculator.py --rest &
          sleep 5  # Wait for API to start

      - name: Run tests and generate JUnit XML
        run: |
          export PYTHONPATH=.
          pytest --junit-xml=report.xml

      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'report.xml'

      - name: Login to ACR
        if: success()  # Only runs if tests pass
        uses: docker/login-action@v3
        with:
          registry: judevops.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        if: success()  # Only runs if tests pass
        run: |
          IMAGE=judevops.azurecr.io/artin-calculator
          docker build -t $IMAGE:latest ./BE

      - name: Push image
        if: success()  # Only runs if tests pass
        run: |
          IMAGE=judevops.azurecr.io/artin-calculator
          docker push $IMAGE:latest